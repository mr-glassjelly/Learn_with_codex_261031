<style>
/* Keep the room, its tap targets, and the dock inside the actual browser viewport. */
html, body { width: 100%; min-width: 0; margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { overflow-x: hidden; }
.app {
  width: 100%; min-width: 0; min-height: 0;
  height: 100vh; height: 100svh; height: 100dvh;
  padding-top: env(safe-area-inset-top, 0px);
}
.profile, .profile-button, .profile-name { min-width: 0; }
.profile-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings { flex: 0 0 38px; }
.studio { flex: 1 1 0px; min-width: 0; min-height: 0; }
/* Absolute sizing prevents the intrinsic SVG size from stretching a flex row. */
.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.dock {
  height: auto; min-height: 0;
  padding: 12px clamp(12px, 5vw, 24px) max(18px, env(safe-area-inset-bottom, 0px));
  gap: clamp(8px, 3vw, 12px);
}
.nav { flex: 1 1 0%; min-width: 0; padding: 0 6px; }
.nav button {
  flex: 1 1 0%; min-width: 0; width: auto; max-width: 48px;
  height: 48px; padding: 0; display: grid; place-items: center;
}
.compose {
  width: clamp(54px, 15vw, 60px); height: clamp(54px, 15vw, 60px);
  flex: 0 0 auto;
}
.toast { max-width: calc(100% - 32px); white-space: normal; text-align: center; }
dialog {
  width: min(430px, 100%); min-width: 0; max-width: 100%;
  max-height: 84vh; max-height: 84svh; max-height: 84dvh;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
}
.sheet { min-width: 0; padding-bottom: max(26px, env(safe-area-inset-bottom, 0px)); }
.sheet-head h2, .list-row > span { min-width: 0; overflow-wrap: anywhere; }
.close { flex: 0 0 30px; }
.sheet textarea { font-size: 16px; }
.book-text { overflow-wrap: anywhere; }
.actions > * { min-width: 0; }
.cover-choice { min-width: 0; }
/* Touch taps should not leave furniture in a hover-shifted position. */
@media (hover: none) {
  .scene [role=button]:hover .object { transform: none; filter: none; }
  .shelf-slot:hover .slot-book { transform: none; filter: none; }
}
@media (max-height: 650px) {
  .dock { padding-top: 8px; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
  .nav { height: 54px; }
}
@media (min-width: 600px) {
  .app { height: min(900px, calc(100vh - 40px)); height: min(900px, calc(100dvh - 40px)); }
  dialog { width: 380px; }
}

</style>

<dialog id="dialog" aria-labelledby="modalTitle"><div class="sheet"><div class="handle" aria-hidden="true"></div><div class="sheet-head"><h2 id="modalTitle"></h2><button class="close" aria-label="닫기">×</button></div><div id="modalBody"></div></div></dialog>
<script>
const $=s=>document.querySelector(s);
const DAY=new Date().toLocaleDateString('sv-SE');
const STORAGE='friction-study-v2';
const initial=()=>({stage:2,entries:[],reward:false,draft:'',display:['sample:0','sample:1','sample:2','sample:3']});
let state=initial();
try{state={...state,...JSON.parse(localStorage.getItem(STORAGE)||'null')}}catch{}
if(!Array.isArray(state.entries))state=initial();
let toastTimer,drawerTimer,lastFocus,demoSnapshot=null;
const dialog=$('#dialog');
const savedToday=()=>state.entries.some(e=>e.date===DAY);
const persist=()=>{if(demoSnapshot)return;try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}};
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 renderDisplay();
 $('#calendarMonth').textContent=new Date().getMonth()+1;
 $('#sceneNote').textContent=demoSnapshot?'성장 미리보기 · 설정에서 돌아갈 수 있어요':'물건을 눌러 서재를 둘러보세요';
 $('#app').classList.toggle('lit',savedToday());
 $('#app').classList.toggle('has-reward',state.reward);
 $('#shelf').style.display=state.stage>=2?'':'none';
 $('#drawers').style.display=state.stage>=1?'':'none';
 $('#promptLabel').innerHTML=savedToday()?'<tspan x="11">오늘의 편지가</tspan><tspan x="11" dy="17">서재를 밝혔어요</tspan>':'<tspan x="11">오늘은 어떤 편지를</tspan><tspan x="11" dy="17">남길까요?</tspan>';
 $('#prompt').setAttribute('aria-label',savedToday()?'오늘의 글 다시 보기':'글쓰기 주제 보기');
}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;toastTimer=setTimeout(()=>$('#toast').textContent='',3300)}
function close(){const writing=$('#writing');if(writing){state.draft=writing.value;persist()}dialog.close();lastFocus?.focus()}
function show(title,html){if(!dialog.open)lastFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;if(!dialog.open)dialog.showModal();}
function row(title,meta,type,cover='心'){return `<button class="list-row" data-action="${type}"><span class="mini-cover">${cover}</span><span>${escapeHtml(title)}<small>${escapeHtml(meta)}</small></span><span class="chevron">›</span></button>`}
const samples=[
 {title:'행복의 조건',text:'거창한 일이 없어도 괜찮은 하루.\n\n햇볕이 좋은 자리에 앉아 잠시 쉬었어요. 한 사람에게 안부를 전할 수 있다는 것만으로도 오늘은 충분했습니다.',author:'달빛낭만'},
 {title:'항상 나만 생각하던',text:'익숙한 길을 조금 천천히 걸었습니다.\n\n문득 당신은 어떤 하루를 보내고 있을지 궁금해졌어요. 이 작은 편지가 당신에게도 닿으면 좋겠습니다.',author:'주개연'},
 {title:'자랑 그거 어떻게 하는건데',text:'오늘 잘한 일을 하나만 떠올려 보려고 해요.\n\n할 일을 끝내고, 오랫동안 미뤄온 안부도 전했습니다. 아주 작은 일이어도 오늘의 나에게는 잘했다고 말해주고 싶어요.',author:'In jeju'},
 {title:'종로가 퍼컬이에요',text:'오래된 골목 사이로 오후 햇살이 들었습니다.\n\n익숙한 풍경에도 매번 다른 빛이 있네요. 편지가 조금 가벼워진 채 집으로 돌아왔어요.',author:'책먹는무무'}
];
const coverPalette=[{bg:'#f5e9e9',ink:'#e93038'},{bg:'#cbd0e9',ink:'#36327d'},{bg:'#f7f7f7',ink:'#222226'},{bg:'#e0e9ff',ink:'#2844b6'}];
function letterFor(ref){
 if(typeof ref!=='string')return null;
 if(/^sample:[0-3]$/.test(ref)){let i=+ref.split(':')[1];return {...samples[i],ref,palette:coverPalette[i],caption:'9월 편지 모임'}}
 if(/^entry:\d+$/.test(ref)){let e=state.entries.find(e=>e.id===+ref.split(':')[1]);if(e)return {...e,ref,author:'주개연',caption:'나의 편지',palette:coverPalette[Math.abs(e.id)%coverPalette.length]}}
 return null;
}
function displayRefs(){
 let refs=Array.isArray(state.display)?state.display:['sample:0','sample:1','sample:2','sample:3'];
 return Array.from({length:4},(_,i)=>letterFor(refs[i])?refs[i]:null);
}
function wrapTitle(text){let chars=Array.from(String(text)),lines=[];for(let i=0;i<chars.length&&lines.length<4;i+=6)lines.push(chars.slice(i,i+6).join(''));if(chars.length>24)lines[3]=lines[3].slice(0,5)+'…';return lines}
function coverHtml(letter){return `<div class="cover-card" style="--cover-bg:${letter.palette.bg};--cover-ink:${letter.palette.ink}"><strong>${escapeHtml(letter.title)}</strong><div class="cover-author">${escapeHtml(letter.author)}<small>${escapeHtml(letter.caption)}</small></div></div>`}
function renderDisplay(){
 const refs=displayRefs();
 $('#displaySlots').innerHTML=refs.map((ref,i)=>{
  const x=i%2===0?265:313,y=i<2?167:271,l=letterFor(ref);
  const edge=(195-x)*.018,topEdge=(200-y)*.018,bottomEdge=(200-y-68)*.018;
  const label=l?`${i<2?'첫째':'둘째'} 칸 · ${l.title} · 읽기 또는 진열 바꾸기`:`${i<2?'첫째':'둘째'} 칸 빈자리 · 글 진열하기`;
  let art=l?`<g class="slot-book"><ellipse cx="23" cy="70" rx="24" ry="2.3" fill="#8f687e" opacity=".2"/><path d="M0 0 ${edge} ${topEdge}V${68+bottomEdge}L0 68Z" fill="#ac8c9e"/><path d="M0 68H42" fill="none" stroke="#dfd0d9" stroke-width=".7"/><rect x="0" y="0" width="42" height="68" rx="2.5" fill="${l.palette.bg}" stroke="#ffffff60" stroke-width=".5"/><text x="4" y="10" font-family="var(--serif)" font-weight="600" font-size="5.4" fill="${l.palette.ink}">${wrapTitle(l.title).map((s,j)=>`<tspan x="4" dy="${j?7.3:0}">${escapeHtml(s)}</tspan>`).join('')}</text><text x="38" y="57.5" text-anchor="end" font-family="var(--serif)" font-size="4.5" font-weight="600" fill="${l.palette.ink}">${escapeHtml(l.author)}</text><text x="38" y="63.2" text-anchor="end" font-family="var(--serif)" font-size="3.1" fill="${l.palette.ink}">${escapeHtml(l.caption)}</text><path d="M2 2V65" stroke="#fff" opacity=".3" stroke-width=".8"/></g>`:`<rect x="0" y="0" width="42" height="68" rx="3" fill="#f5ecf1" fill-opacity=".5" stroke="#c5a6b7" stroke-dasharray="2 3" stroke-width=".7"/><path d="M16 34h10M21 29v10" stroke="#b08e9f" stroke-width="1"/>`;
  return `<g class="shelf-slot" role="button" tabindex="0" data-open="display:${i}" aria-label="${escapeHtml(label)}" transform="translate(${x} ${y})">${art}<rect class="hit" x="-3" y="-7" width="48" height="81" rx="4"/></g>`
 }).join('');
}
function openDisplay(slot){
 if(!Number.isInteger(slot)||slot<0||slot>3)return;
 let ref=displayRefs()[slot],letter=letterFor(ref);
 if(!letter){editDisplay(slot);return}
 show('책장에 진열한 편지',`<div class="cover-preview">${coverHtml(letter)}</div><p class="micro">${slot<2?'첫째':'둘째'} 칸 · ${slot%2===0?'왼쪽':'오른쪽'} 자리</p><div class="actions"><button class="secondary" data-action="display-edit:${slot}">진열 바꾸기</button><button class="primary" data-action="${ref}">글 읽기</button></div>`);
}
function editDisplay(slot){
 if(!Number.isInteger(slot)||slot<0||slot>3)return;
 const refs=displayRefs(),candidates=[...state.entries.map(e=>'entry:'+e.id),...samples.map((_,i)=>'sample:'+i)];
 show(`${slot<2?'첫째':'둘째'} 칸에 진열할 글`, `<p>표지가 보이도록 한 통의 편지를 골라주세요.<br>진열한 글은 서재를 방문한 이웃도 볼 수 있어요.</p><div class="cover-picker">${candidates.map(ref=>{let l=letterFor(ref),selected=refs[slot]===ref,elsewhere=refs.includes(ref)&&!selected;return `<button class="cover-choice ${selected?'chosen':''}" data-action="place:${slot}:${ref}" aria-label="${escapeHtml(l.title)}${selected?' · 현재 진열 중':elsewhere?' · 자리 바꾸기':' 진열하기'}">${coverHtml(l)}<span class="choice-caption">${selected?'현재 진열 중':elsewhere?'선택하면 자리를 바꿔요':'이 글 진열하기'}</span></button>`}).join('')}</div>${refs[slot]?`<button class="secondary" style="width:100%" data-action="place:${slot}:empty">이 자리를 비워두기</button>`:''}<p class="micro">목업의 진열 설정은 이 기기에 저장됩니다.</p>`);
}
function placeDisplay(slot,ref){
 if(!Number.isInteger(slot)||slot<0||slot>3)return;
 if(ref!=='empty'&&!letterFor(ref))return;
 let refs=displayRefs();
 const previous=ref==='empty'?-1:refs.indexOf(ref);
 if(previous>=0&&previous!==slot)refs[previous]=refs[slot];
 refs[slot]=ref==='empty'?null:ref;state.display=refs;persist();render();close();toast(ref==='empty'?'다음 편지를 위한 자리로 비워두었어요':'선택한 편지가 책장에 놓였어요');
}

function open(type){
 if(type.startsWith('display:')){openDisplay(+type.split(':')[1]);return}
 if(type.startsWith('display-edit:')){editDisplay(+type.split(':')[1]);return}
 if(type.startsWith('place:')){const parts=type.split(':');placeDisplay(+parts[1],parts.slice(2).join(':'));return}
 if(type==='lamp'){open(savedToday()?'today':'write');return}
 if(type==='collection'){$('#app').classList.add('drawer-open');clearTimeout(drawerTimer);drawerTimer=setTimeout(()=>$('#app').classList.remove('drawer-open'),1200)}
 if(type==='write'){show('오늘의 편지',`<p>오늘, 고마웠던 순간이 있었나요?</p><textarea id="writing" aria-label="오늘의 글" placeholder="한 줄의 편지도 좋아요.">${escapeHtml(state.draft)}</textarea><button class="primary" id="save" ${state.draft.trim()?'':'disabled'}>기록하고 불 켜기</button><p class="micro">이 기기에 저장되는 목업입니다. 실제 편지는 전송되지 않아요.</p>`);$('#writing').addEventListener('input',e=>{state.draft=e.target.value;$('#save').disabled=!state.draft.trim();persist()});$('#save').onclick=()=>{let text=$('#writing').value.trim();if(!text)return;let entry={id:Date.now(),text,title:text.split('\n')[0].slice(0,25),date:DAY,sent:false};state.entries.unshift(entry);state.stage=Math.max(1,state.stage);state.draft='';persist();render();show('서재에 불이 켜졌어요',`<p>오늘의 편지를 기록했어요.<br>이웃에게 전하면 책장에도 한 통의 편지가 쌓여요.</p><div class="actions"><button class="secondary" data-action="return">서재로</button><button class="primary" id="send">전송 체험하기</button></div><p class="micro">시연용 전송 · 실제 수신자는 없습니다</p>`);$('#send').onclick=()=>send(entry.id)};return}
 if(type==='today'){let e=state.entries.find(e=>e.date===DAY);if(e){show('오늘 남긴 편지',`<div class="book-text">${escapeHtml(e.text)}</div><p>${e.sent?'전송 체험 완료':'나만의 기록으로 보관 중'}</p><div class="actions"><button class="secondary" data-action="write">새 글 쓰기</button>${e.sent?'':`<button class="primary" id="send">전송 체험하기</button>`}</div>`);if($('#send'))$('#send').onclick=()=>send(e.id)}return}
 if(type==='archive'||type==='books'){let items=state.entries.filter(e=>type==='archive'||e.sent);let html=type==='archive'?'<p>아직 보내지 않은 편지도 이곳에 머물러요.</p>':'<p>한 통 한 통, 편지가 쌓이는 책장.</p>';html+=items.map(e=>row(e.title,e.date+(e.sent?' · 전송 체험 완료':' · 나만의 기록'),'entry:'+e.id)).join('');if(state.stage>=2)html+=samples.map((s,i)=>row(s.title,'대표 편지 · '+s.author,'sample:'+i)).join('');if(!items.length&&state.stage<2)html+='<p>아직 기록이 없어요. 첫 편지를 남겨볼까요?</p>';html+='<div class="actions">'+(type==='books'?'<button class="secondary" data-action="display-edit:0">진열 관리</button>':'')+'<button class="primary" data-action="write">새 편지 쓰기</button></div>';show(type==='archive'?'기록함':'나의 책장',html);return}
 if(type==='collection'){show('서랍 속 작은 수집',`<p>모아둔 편지지와 우표를 꺼내보세요.</p>${row('이번 주의 편지지','가을의 안부 · '+(state.reward?'소장 중':'글을 쓰고 전송하면 획득'),'reward','秋')}${row('기본 편지지','언제든 사용할 수 있어요','basic','白')}${row('모아둔 우표',state.reward?'가을 우표 · 1종':'아직 모은 우표가 없어요','stamps','郵')}`);return}
 if(type==='reward'){show('이번 주의 편지지',`<div class="paper"><span>가을의 안부</span><small>느리게 도착해도<br>편지은 닿으니까.</small></div><p style="text-align:center">${state.reward?'편지지와 우표를 소장하고 있어요.':'이번 주에 글을 작성하고 전송하면<br>편지지와 우표를 영구 소장해요.'}</p><button class="primary" data-action="write">이 편지으로 글 쓰기</button>`);return}
 if(type==='settings'){show('서재 설정',`<div class="setting-row">공개 범위<span>이웃 공개</span></div><button class="list-row" data-action="profile">내 프로필<span class="chevron">›</span></button><button class="list-row" data-action="stages">서재 성장 미리보기<span class="chevron">›</span></button>${demoSnapshot?'<button class="list-row" data-action="restore">미리보기 끝내기<span class="chevron">›</span></button>':''}<p class="micro">디자인 목업 · 공개 범위는 예시입니다.</p>`);return}
 if(type==='stages'){show('서재 성장 미리보기',`<p>첫 기록과 첫 전송이 공간을 채워요.<br>아래 단계는 시연 상태로 전환됩니다.</p>${['첫 방문','첫 기록','첫 전송 이후'].map((s,i)=>`<button class="step ${state.stage===i?'selected':''}" data-stage="${i}"><span>${s}<small>${['책상만 있는 작은 공간','서랍이 생기고 램프가 켜져요','오른쪽에 책장이 놓여요'][i]}</small><span>${state.stage===i?'✓':'→'}</span></button>`).join('')}`);return}
 if(type==='profile'){show('주개연의 서재',`<p>@주개연<br>편지를 차곡차곡 모으는 곳</p><div class="profile-stats"><span><b>${12+state.entries.filter(e=>e.sent).length}</b><small>발신한 편지</small></span><span><b>5</b><small>이웃</small></span><span><b>78</b><small>완독한 편지</small></span></div><button class="primary" data-action="neighbors">이웃 둘러보기</button>`);return}
 if(type==='calendar'){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),count=new Date(y,m+1,0).getDate(),offset=new Date(y,m,1).getDay();let days=new Set(state.entries.filter(e=>e.date.startsWith(DAY.slice(0,7))).map(e=>+e.date.slice(-2)));show('편지를 남긴 날',`<p>${y}년 ${m+1}월 · ${days.size}일 기록했어요</p><div class="grid-calendar">${['일','월','화','수','목','금','토'].map(d=>'<span>'+d+'</span>').join('')}${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>`<span class="${days.has(i+1)?'attended':''}" ${days.has(i+1)?'aria-label="'+(i+1)+'일 기록함"':''}>${i+1}</span>`).join('')}</div>`);return}
 if(type==='inbox'){show('수신함',`<p>이웃이 남겨준 편지가에요.</p>${row('행복의 조건','달빛낭만 · 9월 편지 모임','sample:0')}${row('항상 나만 생각하던','주개연 · 9월 편지 모임','sample:1')}`);return}
 if(type==='neighbors'){show('이웃의 공간',`<p>각자의 속도로 편지를 모으는 사람들.</p>${row('달빛낭만','작은 행복을 수집합니다.','neighbor:0','月')}${row('In jeju','제주에서 보내는 안부','neighbor:1','濟')}`);return}
 if(type.startsWith('neighbor:')){let name=type.endsWith('0')?'달빛낭만':'In jeju';show(name+'의 서재',`<p>이웃이 공개해 둔 대표 편지예요.</p>${row('행복의 조건','공개된 대표 편지','sample:0')}<p class="micro">예시 프로필입니다.</p>`);return}
 if(type.startsWith('sample:')){let s=samples[+type.split(':')[1]];if(!s)return;show(s.title,`<div class="book-text">${escapeHtml(s.text)}</div><p style="text-align:right">${s.author}</p>`);return}
 if(type.startsWith('entry:')){let e=state.entries.find(e=>e.id===+type.split(':')[1]);if(!e)return;show(e.title,`<div class="book-text">${escapeHtml(e.text)}</div><p>${e.date} · ${e.sent?'전송 체험 완료':'나만의 기록'}</p>${e.sent?'':'<button class="primary" id="send">전송 체험하기</button>'}`);if($('#send'))$('#send').onclick=()=>send(e.id);return}
 if(type==='basic'){show('기본 편지지','<div class="paper" style="background:#f7f6f6"><span>당신에게</span><small>편지를 담아.</small></div><button class="primary" data-action="write">글 쓰기</button>');return}
 if(type==='stamps'){show('모아둔 우표',state.reward?'<div class="paper" style="height:150px;width:130px;border:5px dotted white;text-align:center;justify-content:center">秋<br><small style="text-align:center">가을의 안부</small></div><p class="micro">편지지와 함께 소장한 가을 우표예요.</p>':'<p>첫 편지를 전하고 이번 주의 우표를 모아보세요.</p><button class="primary" data-action="write">편지 쓰기</button>');return}
 if(type==='restore'){state=demoSnapshot||state;demoSnapshot=null;render();close();toast('나의 서재로 돌아왔어요');return}
 if(type==='return')close();
}
function send(id){let e=state.entries.find(e=>e.id===id);if(!e)return;e.sent=true;let firstReward=!state.reward;state.reward=true;state.stage=2;persist();render();show('편지가 전해졌어요',`<p>책장에 새로운 편지가 놓였어요.${firstReward?'<br>이번 주의 편지지와 우표도 서랍에 담았어요.':''}</p>${firstReward?'<div class="paper"><span>가을의 안부</span><small>편지지 + 우표<br>소장 완료</small></div>':''}<button class="primary" data-action="return">서재로 돌아가기</button><p class="micro">시연용 전송이 완료되었습니다.</p>`);toast('새 편지지 샘플이 책상 위에 놓였어요')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-open],[data-action],[data-stage]');if(!b)return;if(b.hasAttribute('data-stage')){let n=+b.dataset.stage;if(!demoSnapshot)demoSnapshot=structuredClone(state);state={stage:n,entries:n===1?[{id:Date.now(),title:'첫 번째 편지',text:'오늘은 작은 서재에 첫 편지를 남겼어요.',date:DAY,sent:false}]:[],reward:false,draft:''};persist();render();close();toast(['첫 방문의 서재예요','첫 기록으로 서랍이 생겼어요','첫 전송 이후의 서재예요'][n]);return}open(b.dataset.open||b.dataset.action)});
$('.scene').addEventListener('keydown',e=>{const el=e.target.closest('[role=button][data-open]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open(el.dataset.open)}});
$('.close').onclick=close;
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
dialog.addEventListener('cancel',e=>{e.preventDefault();close()});
$('#profileNav').onclick=()=>{if(dialog.open)close();else toast('나의 서재에 머무르고 있어요')};
render();

</script>
</body></html>
